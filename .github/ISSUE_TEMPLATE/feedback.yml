name: 问题反馈与建议
description: 分享使用问题、功能建议或计算核对结果
body:
  - type: markdown
    attributes:
      value: 感谢反馈！激活申请请发至 501919931@qq.com，不要在公开 Issue 中填写设备码、激活文件或敏感实验数据。
  - type: input
    id: version
    attributes:
      label: 软件版本与 Windows 版本
  - type: textarea
    id: details
    attributes:
      label: 问题或建议
      description: 请说明操作步骤、预期结果与实际结果；样例请匿名化。
    validations:
      required: true
